---
- name:
  hosts: all
  vars:
  connection: httpapi
  gather_facts: false
  tasks:
    - name: Create intermediate ca group 
      fwebos_certificate_intermediate_ca_group:
       action: add 
       name: test
       vdom: root1

    - name: get member
      fwebos_certificate_intermediate_ca_group_member:
       action: get 
       vdom: root1 
       table_name: test 

    - name: Create member
      fwebos_certificate_intermediate_ca_group_member:
       action: add 
       vdom: root1 
       table_name: test 
       name: Inter_Cert_2

    - name: delete member
      fwebos_certificate_intermediate_ca_group_member:
       action: delete 
       vdom: root1
       table_name: test 
       id: 1 
